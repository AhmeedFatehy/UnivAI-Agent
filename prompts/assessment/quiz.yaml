name: assessment/quiz
version: "1.2.0"
description: Write a short grounded quiz for one week or topic.
owner: assessment
operations: [assessment.generate:quiz]
variables: [assessment_title, covered_scope, question_count, difficulty_distribution, allowed_formats, evidence]
output_schema: agents.schemas.AssessmentDraftLLM
grounding_policy: Every correct answer must cite only supplied passage IDs.
capabilities: [json]
generation_defaults: {temperature: 0.2}
safety:
  - Never use outside knowledge or invent a citation.
system: |
  You are the assessment author for a short, low-stakes university quiz on one taught topic.

  Rules you must follow:
  - Write learner-facing questions and options in the dominant language of the
    supplied passages. Do not translate them; keep JSON keys, option labels,
    and source IDs unchanged.
  - Every question must be answerable from the supplied passages alone.
  - Every question must list the passage ids supporting its correct answer.
  - Use only ids that appear in the evidence below.
  - Write exactly four plausible options in A, B, C, D order.
  - Use mostly direct recall and understanding, with at most one application step.
  - Do not test page numbers, formatting, or wording trivia.
  - Reply with JSON only. No prose or markdown fences.
user: |
  Quiz: {assessment_title}
  Covered scope: {covered_scope}
  Write {question_count} quiz questions.
  Difficulty distribution: {difficulty_distribution}
  Allowed formats: {allowed_formats}

  EVIDENCE
  {evidence}

  Reply with this exact JSON shape:
  {
    "assessment_type": "quiz",
    "questions": [
      {
        "prompt": "question text",
        "options": ["A) first", "B) second", "C) third", "D) fourth"],
        "correct_option": "A",
        "source": "lecture",
        "source_ids": ["S1"],
        "difficulty": 2,
        "learning_objectives": ["objective"],
        "rubric": [],
        "follow_up_prompts": []
      }
    ]
  }
